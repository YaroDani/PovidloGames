{% extends 'base.html' %}

{% block title %}{{ name_event }}{% endblock %}

{% block content %}
<style>
  .event-hero {
    background: linear-gradient(90deg, #312a53 0%, #4e4376 100%);
    color: #fff;
    border-radius: 1.5rem;
    box-shadow: 0 10px 30px rgba(60,30,110,0.13);
    padding: 2.5rem 2rem 2rem 2rem;
    margin-bottom: 2.5rem;
    max-width: 700px;
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .event-hero h2 {
    font-size: 2.3rem;
    font-weight: bold;
    margin-bottom: 1.3rem;
    letter-spacing: .02em;
    text-shadow: 0 2px 6px #281e3e88;
  }
  .event-label {
    font-weight: 600;
    color: #ffd700;
    font-size: 1.12rem;
    margin-bottom: .2rem;
    display: block;
  }
  .event-desc {
    font-size: 1.13rem;
    background: rgba(255,255,255,0.04);
    border-radius: .7rem;
    padding: 1rem 1.2rem;
    margin-bottom: 1.4rem;
    box-shadow: 0 3px 10px #2e234110;
  }
  .event-dates, .event-author {
    margin-bottom: 1.2rem;
  }
  .event-author a {
    color: #ffd700;
    font-weight: 600;
    text-decoration: none;
    transition: text-shadow .18s;
  }
  .event-author a:hover {
    text-shadow: 0 2px 8px #ffd70044;
  }
  .event-btns {
    display: flex;
    gap: 1.2rem;
    flex-wrap: wrap;
    margin-top: 2rem;
  }
  .event-btns .btn {
    min-width: 160px;
    font-weight: 600;
    letter-spacing: .04em;
    border-radius: .9rem;
    box-shadow: 0 2px 10px #2e234112;
    transition: background .16s, box-shadow .16s;
  }
  .event-btns .btn-success {
    background: linear-gradient(95deg, #00c16a 60%, #6dffb1 100%);
    border: none;
    color: #1a192d;
  }
  .event-btns .btn-success:hover {
    background: linear-gradient(85deg, #00c16a 80%, #ffd700 100%);
    color: #222;
    box-shadow: 0 4px 18px #00c16a22;
  }
</style>

<div class="container my-5 d-flex justify-content-center">
  <div class="event-hero">
    <h2 class="text-center">{{ name_event }}</h2>

    <div class="event-desc mb-3">
      <span class="event-label">Description:</span>
      {{ info_event | safe }}
    </div>

    <div class="event-dates mb-3">
      <span class="event-label">Dates:</span>
      <span>{{ start_date }} &ndash; {{ end_date }}</span>
    </div>

    <div class="event-author mb-4">
      <span class="event-label">Created by:</span>
      <a href="profile-{{ name_author }}">{{ name_author }}</a>
    </div>

    <div class="event-btns text-center">
      <form method="POST">
        <button type="submit" class="btn btn-success px-5">Join Event</button>
      </form>
      <a href="{{ url_for('home.add_game', event_id=event['id']) }}" class="btn btn-success">Add Game to This Event</a>
    </div>
  </div>
</div>
{% endblock %}
